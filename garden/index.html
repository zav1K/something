<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Garden — L-system tree generator</title>
<meta name="description" content="Grow unique procedural trees and plants from L-system grammars.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🌿</span> Procedural Garden</div>
      <div class="hint" id="hint-text">drag the plant to rotate · scroll to zoom</div>
    </header>

    <main class="layout">
      <section class="panel controls">
        <label class="field">
          <span class="field-label">Species</span>
          <select id="preset-input">
            <optgroup label="Real species">
              <option value="oak" selected>Oak</option>
              <option value="willow">Weeping Willow</option>
              <option value="pine">Pine</option>
              <option value="sakura">Sakura</option>
              <option value="bonsai">Bonsai Juniper</option>
            </optgroup>
            <optgroup label="Abstract">
              <option value="fractalPlant">Fractal Plant</option>
              <option value="binaryTree">Young Sapling</option>
              <option value="bushyShrub">Bushy Shrub</option>
              <option value="sparseTree">Sparse Tree</option>
            </optgroup>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Season</span>
          <select id="season-input">
            <option value="spring">Spring</option>
            <option value="summer" selected>Summer</option>
            <option value="autumn">Autumn</option>
            <option value="winter">Winter</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Growth stage <span id="age-value">100</span>%</span>
          <input type="range" id="age-input" min="0" max="100" step="1" value="100">
        </label>

        <label class="field">
          <span class="field-label">Iterations <span id="iter-value">5</span></span>
          <input type="range" id="iter-input" min="1" max="6" step="1" value="5">
        </label>

        <label class="field">
          <span class="field-label">Branch angle <span id="angle-value">22</span>°</span>
          <input type="range" id="angle-input" min="5" max="45" step="1" value="22">
        </label>

        <label class="field">
          <span class="field-label">Wildness (jitter) <span id="jitter-value">4</span>°</span>
          <input type="range" id="jitter-input" min="0" max="15" step="1" value="4">
        </label>

        <label class="field">
          <span class="field-label">Branch taper <span id="decay-value">0.90</span></span>
          <input type="range" id="decay-input" min="0.7" max="0.98" step="0.01" value="0.90">
        </label>

        <label class="field field-inline">
          <input type="checkbox" id="leaves-input" checked>
          <span class="field-label">Leaves</span>
        </label>

        <div class="divider"></div>

        <button id="grow-btn" class="btn btn-primary">🌱 Grow</button>
        <button id="download-btn" class="btn btn-secondary">⬇ Download PNG</button>
        <button id="share-btn" class="btn btn-ghost">🔗 Copy link to this plant</button>
      </section>

      <section class="panel preview">
        <canvas id="tree-canvas"></canvas>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
